<!DOCTYPE html>
<html>
<head><title>Resize Header to 4096×2304</title></head>
<body style="margin:0;background:#222;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh">
<p>Processing header.jpg → 4096 × 2304...</p>
<canvas id="c" width="4096" height="2304" style="max-width:90vw;border:1px solid #555"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 4096, H = 2304;

const img = new Image();
img.onload = () => {
  // 1. Sample the dominant background color from the image edges
  const tmp = document.createElement('canvas');
  tmp.width = img.width; tmp.height = img.height;
  const tctx = tmp.getContext('2d');
  tctx.drawImage(img, 0, 0);

  // Sample colors from edges (top-left, top-right, bottom-left, bottom-right corners + edges)
  const samples = [];
  const samplePoints = [
    [2, 2], [img.width-3, 2], [2, img.height-3], [img.width-3, img.height-3],
    [Math.floor(img.width/2), 2], [2, Math.floor(img.height/2)],
    [img.width-3, Math.floor(img.height/2)], [Math.floor(img.width/2), img.height-3],
    [10, 10], [img.width-11, 10], [10, img.height-11], [img.width-11, img.height-11]
  ];
  for (const [x, y] of samplePoints) {
    const d = tctx.getImageData(x, y, 1, 1).data;
    samples.push([d[0], d[1], d[2]]);
  }
  // Average the samples
  const avg = samples.reduce((a, c) => [a[0]+c[0], a[1]+c[1], a[2]+c[2]], [0,0,0]);
  const bgColor = `rgb(${Math.round(avg[0]/samples.length)},${Math.round(avg[1]/samples.length)},${Math.round(avg[2]/samples.length)})`;

  // 2. Fill entire canvas with the background color
  ctx.fillStyle = bgColor;
  ctx.fillRect(0, 0, W, H);

  // 3. Create a subtle gradient to blend edges naturally
  // Sample a slightly darker shade for depth
  const r = Math.round(avg[0]/samples.length);
  const g = Math.round(avg[1]/samples.length);
  const b = Math.round(avg[2]/samples.length);
  const darker = `rgb(${Math.max(0,r-15)},${Math.max(0,g-10)},${Math.max(0,b-5)})`;

  // Subtle radial gradient for natural feel
  const grad = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.7);
  grad.addColorStop(0, bgColor);
  grad.addColorStop(1, darker);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // 4. Scale image proportionally to fit within 4096×2304
  const scaleX = W / img.width;
  const scaleY = H / img.height;
  const scale = Math.min(scaleX, scaleY); // fit entirely
  const drawW = img.width * scale;
  const drawH = img.height * scale;
  const drawX = (W - drawW) / 2;
  const drawY = (H - drawH) / 2;

  // 5. If there are blank areas, extend edge pixels to blend
  // Draw stretched edge strips behind the image for smoother blending
  if (drawH < H) {
    // Top strip: stretch top row of image
    ctx.drawImage(img, 0, 0, img.width, 2, drawX, 0, drawW, drawY + 20);
    // Bottom strip: stretch bottom row of image
    ctx.drawImage(img, 0, img.height-2, img.width, 2, drawX, drawY + drawH - 20, drawW, H - drawY - drawH + 20);

    // Gradient overlays to blend strips into background
    const topGrad = ctx.createLinearGradient(0, 0, 0, drawY + 20);
    topGrad.addColorStop(0, bgColor);
    topGrad.addColorStop(0.7, bgColor);
    topGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = topGrad;
    ctx.fillRect(0, 0, W, drawY + 20);

    const botGrad = ctx.createLinearGradient(0, drawY + drawH - 20, 0, H);
    botGrad.addColorStop(0, 'rgba(0,0,0,0)');
    botGrad.addColorStop(0.3, bgColor);
    botGrad.addColorStop(1, bgColor);
    ctx.fillStyle = botGrad;
    ctx.fillRect(0, drawY + drawH - 20, W, H - drawY - drawH + 20);
  }
  if (drawW < W) {
    // Left strip
    ctx.drawImage(img, 0, 0, 2, img.height, 0, drawY, drawX + 20, drawH);
    // Right strip
    ctx.drawImage(img, img.width-2, 0, 2, img.height, drawX + drawW - 20, drawY, W - drawX - drawW + 20, drawH);

    const leftGrad = ctx.createLinearGradient(0, 0, drawX + 20, 0);
    leftGrad.addColorStop(0, bgColor);
    leftGrad.addColorStop(0.7, bgColor);
    leftGrad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = leftGrad;
    ctx.fillRect(0, 0, drawX + 20, H);

    const rightGrad = ctx.createLinearGradient(drawX + drawW - 20, 0, W, 0);
    rightGrad.addColorStop(0, 'rgba(0,0,0,0)');
    rightGrad.addColorStop(0.3, bgColor);
    rightGrad.addColorStop(1, bgColor);
    ctx.fillStyle = rightGrad;
    ctx.fillRect(drawX + drawW - 20, 0, W - drawX - drawW + 20, H);
  }

  // 6. Draw the actual image centered
  ctx.drawImage(img, drawX, drawY, drawW, drawH);

  // 7. Soft feather edges of the image into the background
  const feather = 40;
  // Top edge feather
  const tf = ctx.createLinearGradient(0, drawY, 0, drawY + feather);
  tf.addColorStop(0, bgColor); tf.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = tf; ctx.fillRect(drawX, drawY, drawW, feather);
  // Bottom edge feather
  const bf = ctx.createLinearGradient(0, drawY + drawH - feather, 0, drawY + drawH);
  bf.addColorStop(0, 'rgba(0,0,0,0)'); bf.addColorStop(1, bgColor);
  ctx.fillStyle = bf; ctx.fillRect(drawX, drawY + drawH - feather, drawW, feather);

  // Auto-download
  setTimeout(() => {
    const link = document.createElement('a');
    link.download = 'siteshrimp-header-4096x2304.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
    document.querySelector('p').textContent = 'Done! Header image downloaded (4096×2304). You can also right-click the canvas to save.';
  }, 500);
};

img.onerror = () => {
  document.querySelector('p').innerHTML = 'Could not load header.jpg. <label style="color:#ff6b00;cursor:pointer;text-decoration:underline">Click to select it<input type="file" accept="image/*" style="display:none" id="pick"></label>';
  document.getElementById('pick').onchange = e => {
    if (e.target.files[0]) img.src = URL.createObjectURL(e.target.files[0]);
  };
};

img.src = 'header.jpg';
</script>
</body>
</html>
