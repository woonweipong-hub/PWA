<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#ff6b00"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="description" content="Defects, site and FM tracking with AI, voice, Telegram and real-time sync"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png"/>
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png"/>
<title>SiteShrimp – Site Tracker</title>
<!-- React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<!-- Babel removed — app.js is pre-compiled now -->
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;background:#f0ede8;touch-action:pan-x pan-y;}
body{font-family:'Barlow',sans-serif;}
input,textarea,select{outline:none;font-family:'Barlow',sans-serif;}
::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes sevPulse{0%{transform:translate(-50%,-50%) scale(1);opacity:0.5;}50%{transform:translate(-50%,-50%) scale(1.8);opacity:0;}100%{transform:translate(-50%,-50%) scale(1);opacity:0;}}
.anim{animation:slideUp 0.3s ease forwards;}
.pin-tip{display:none!important;pointer-events:none;}
div:hover>.pin-tip,div:active>.pin-tip{display:block!important;}
/* Top-bar dropdown menus */
.dd-panel{animation:ddIn 0.16s ease-out both;transform-origin:top right;}
@keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(0.97);}to{opacity:1;transform:translateY(0) scale(1);}}
.dd-row{position:relative;width:100%;text-align:left;background:transparent;border:none;cursor:pointer;color:#fff;display:flex;align-items:center;gap:11px;padding:9px 14px;transition:background 0.12s ease;}
.dd-row:hover{background:rgba(255,255,255,0.06);}
.dd-row:hover .dd-ico{transform:scale(1.06);}
.dd-row.danger:hover{background:rgba(255,59,48,0.1);}
.dd-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.15s ease;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.18);color:rgba(255,255,255,0.78);}
.dd-row:hover .dd-ico{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.28);}
.dd-label{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13.5px;color:#fff;letter-spacing:0.01em;}
.dd-sub{font-size:10px;color:rgba(255,255,255,0.35);margin-top:1px;font-weight:400;letter-spacing:0;}
.dd-pill{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:9px;letter-spacing:0.08em;padding:3px 8px;border-radius:999px;flex-shrink:0;}
</style>
</head>
<body>
<div id="root"></div>
<script>
// PocketBase backend URL — auto-migrate old DuckDNS URLs
if((localStorage.getItem('pb_url')||'').includes('duckdns')){localStorage.removeItem('pb_url');}
const PB_URL = localStorage.getItem('pb_url') || 'https://api.siteshrimp.org';
// Service worker
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
// Capture install prompt for later use
let _deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _deferredInstallPrompt = e;
});
</script>
<!-- Fabric.js — photo annotation canvas (lazy-loadable) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js" defer></script>
<!-- PDF.js — render PDF drawings -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<!-- jsPDF — PDF report generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" defer></script>
<!-- pdf-lib — post-process merge for true-vector PDF-source drawing pages -->
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js" defer></script>
<!-- ImageTracer + svg2pdf — convert JPG sketches to vector PDF drawings -->
<script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js" defer></script>
<!-- svg2pdf pinned to v1.5.x. v2 rejects many of ImageTracer's path
     attributes (opacity formatting, missing viewBox, etc.), producing
     near-empty vector output for scan-class inputs. v1.5.x accepts
     ImageTracer's SVG verbatim and returns a Promise we can await. -->
<script src="https://cdn.jsdelivr.net/npm/svg2pdf.js@1.5.0/dist/svg2pdf.min.js" defer></script>
<!-- Leaflet — free OSM map tiles (no API key needed) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<!-- Marker clustering — groups overlapping pins into numbered bubbles -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js" defer></script>
<script src="https://unpkg.com/@googlemaps/markerclusterer@2.5.3/dist/index.min.js" defer></script>
<!-- PocketBase data layer -->
<script src="js/db.js?v=c17b40a"></script>
<!-- Shared constants (entry types, statuses, components, locations) -->
<script src="js/constants.js?v=c17b40a"></script>
<!-- i18n — lightweight translation helper (must load before app.js) -->
<script src="js/lang.js?v=c17b40a"></script>
<!-- App logic — pre-compiled, no Babel needed -->
<script src="js/app.compiled.js?v=c17b40a"></script>
</body>
</html>
