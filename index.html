<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#ff6b00"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="description" content="Construction defect tracking with AI, Telegram and real-time sync"/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icons/icon-192.svg"/>
<title>SiteSnag – Defect Tracker</title>
<!-- React -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<!-- EmailJS -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body,#root{height:100%;background:#f0ede8;}
body{font-family:'Barlow',sans-serif;}
input,textarea,select{outline:none;font-family:'Barlow',sans-serif;}
::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);}
@keyframes slideUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
.anim{animation:slideUp 0.3s ease forwards;}
</style>
</head>
<body>
<div id="root"></div>
<script>
// PocketBase backend URL
const PB_URL = localStorage.getItem('pb_url') || 'https://sitesnag.duckdns.org';
// PWA service worker
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
<!-- PocketBase data layer -->
<script src="js/db.js"></script>
<!-- App logic — Babel processes JSX -->
<script type="text/babel" src="js/app.js"></script>
</body>
</html>
