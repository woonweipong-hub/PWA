<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded rect border -->
  <rect x="20" y="20" width="472" height="472" rx="75" fill="#fff" stroke="#e8802a" stroke-width="20"/>
  <g transform="translate(256,256) scale(2.67)" fill="#e8802a">
    <!-- Ground / hill (translated to center coords) -->
  </g>
  <!-- Use same drawing scaled up -->
  <g transform="translate(0,0) scale(2.6667)">
    <g fill="#e8802a">
      <!-- Ground / hill -->
      <path d="M8,156 Q40,120 70,134 Q90,142 96,128 Q104,118 120,130 Q140,144 160,126 Q172,118 184,124 L184,176 Q184,184 176,184 L16,184 Q8,184 8,176 Z"/>

